# Kernel network limits for a high-concurrency API.
# Install: sudo cp deploy/99-thridhavarnam-sysctl.conf /etc/sysctl.d/ && sudo sysctl --system
net.core.somaxconn = 16384             # max accept queue (caps nginx/Node backlog)
net.ipv4.tcp_max_syn_backlog = 16384   # half-open connections during a burst
net.core.netdev_max_backlog = 16384
net.ipv4.ip_local_port_range = 10240 65535   # more ports for nginx -> Node sockets
net.ipv4.tcp_tw_reuse = 1
fs.file-max = 1000000
