# nginx site for api.thridhavarnam.com, tuned for thousands of concurrent
# shoppers. Install to /etc/nginx/sites-available/ (see DEPLOY.md).
# Certificate paths are certbot's defaults; adjust if yours differ.

# Short "micro-cache" for public storefront GETs. Even 5 seconds means nginx
# answers most requests itself during a spike, without touching Node.
proxy_cache_path /var/cache/nginx/thv levels=1:2 keys_zone=thv_api:20m
                 max_size=500m inactive=10m use_temp_path=off;

upstream thv_api {
    server 127.0.0.1:5000;
    keepalive 256;              # reuse connections to Node instead of reopening
}

# Only these read-only public endpoints are cached by nginx.
map $request_uri $thv_cacheable {
    default                       0;
    ~^/api/products               1;
    ~^/api/categories             1;
    ~^/api/occasions              1;
    ~^/api/banners                1;
    ~^/api/price-buckets          1;
    ~^/api/colorways              1;
    ~^/api/stories                1;
    ~^/api/reviews                1;
    ~^/api/storefront/init        1;
}
map "$request_method:$thv_cacheable:$http_authorization" $thv_skip_cache {
    default     1;
    "GET:1:"    0;              # anonymous GET on a public endpoint
    "HEAD:1:"   0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.thridhavarnam.com;
    return 301 https://$host$request_uri;
}

server {
    # backlog: queue for connections nginx hasn't accepted yet. The default
    # (511) overflowed in the 2,000-3,000 user test and caused timeouts.
    listen 443 ssl http2 backlog=16384;   # nginx 1.24 syntax (server runs 1.24.0)
    listen [::]:443 ssl http2 backlog=16384;
    server_name api.thridhavarnam.com;

    ssl_certificate     /etc/letsencrypt/live/api.thridhavarnam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.thridhavarnam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Resume TLS sessions so returning clients skip the expensive handshake.
    ssl_session_cache shared:THV_SSL:50m;
    ssl_session_timeout 1d;

    client_max_body_size 15m;   # matches express.json limit (base64 images)
    keepalive_timeout 65;
    keepalive_requests 1000;

    location / {
        proxy_pass http://thv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache thv_api;
        proxy_cache_bypass $thv_skip_cache;
        proxy_no_cache $thv_skip_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # Ignore the API's browser Cache-Control (30s) so nginx keeps copies
        # for only 5s: admin edits reach shoppers within a few seconds.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;                         # one request refills the cache
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Nginx-Cache $upstream_cache_status always;
    }
}
