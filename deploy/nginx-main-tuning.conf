# Settings for /etc/nginx/nginx.conf (merge into the existing file; these
# REPLACE the matching lines, they don't add new blocks).
#
# Ubuntu's default is worker_connections 768 per worker. Each shopper uses one
# client connection plus one to Node, so 4 workers x 768 caps out around
# 1,500 shoppers. These values allow tens of thousands.

worker_processes auto;            # one per CPU core (4 on this VPS)
worker_rlimit_nofile 65535;       # top level, next to worker_processes

events {
    worker_connections 16384;
    multi_accept on;
}
